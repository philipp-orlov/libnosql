# Builds and tests on every push and pull request: a Release build, an
# address+undefined sanitizer build and a thread sanitizer build, and the
# Release and thread sanitizer builds again with every store's commits pipelined
# (NOSQL_PIPELINE_COMMITS_DEFAULT), since that path is opt-in, and a Release
# build with every byte-ordered tree prefix-compressed (NOSQL_PREFIX_KEYS_DEFAULT),
# an MSVC build on Windows, and a short run of each libFuzzer target.
name: ci

on:
  push:
  pull_request:

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DNOSQL_ENABLE_ASAN=ON
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure -j4

  tsan:
    # Clang, not GCC: GCC 13's libtsan does not intercept pthread_mutex_clocklock,
    # which std::timed_mutex::try_lock_for uses, and so reports every timed
    # writer's unlock as an unlock of an unlocked mutex.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
      - name: Fit the address space to the thread sanitizer
        # With the kernel's full mmap randomization the sanitizer's fixed
        # shadow layout can collide with a mapping, and it aborts at start.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-18 -DNOSQL_ENABLE_TSAN=ON
      - name: Build
        run: cmake --build build
      - name: Test
        # The allocation-counting suites are not built here; see tests/CMakeLists.txt.
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure -j4

  release-pipelined:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DNOSQL_PIPELINE_COMMITS_DEFAULT=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4

  release-prefix-keys:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DNOSQL_PREFIX_KEYS_DEFAULT=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -j4

  tsan-pipelined:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
      - name: Fit the address space to the thread sanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-18 -DNOSQL_ENABLE_TSAN=ON
          -DNOSQL_PIPELINE_COMMITS_DEFAULT=ON
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure -j4

  fuzz:
    # A short run of each target on every push: long enough to catch what a
    # change breaks outright, not a substitute for a long campaign.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
      - name: Fit the address space to the address sanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-18 -DNOSQL_BUILD_FUZZERS=ON
      - name: Build
        run: cmake --build build --target fuzz_ops fuzz_pages fuzz_power fuzz_replication
      - name: Model fuzzing
        run: build/fuzz/fuzz_ops -max_total_time=120 -max_len=8192
      - name: Page fuzzing
        run: |
          build/fuzz/fuzz_pages -max_total_time=60
          FUZZ_SUFFIXES=1 build/fuzz/fuzz_pages -max_total_time=60
      - name: Power-cut fuzzing
        run: build/fuzz/fuzz_power -max_total_time=90
      - name: Replication fuzzing
        run: build/fuzz/fuzz_replication -max_total_time=60 -max_len=4096
